services:
  frontend:
    build: ./devfolio-frontend
    restart: always
    container_name: devfolio-frontend
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-router.rule=Host(`makridakis.tech`) || Host(`www.makridakis.tech`)"
      - "traefik.http.routers.frontend-router.entrypoints=websecure"
      - "traefik.http.routers.frontend-router.tls.certresolver=devfolio-resolver"
      - "traefik.http.services.frontend-service.loadbalancer.server.port=80"

  backend:
    build: ./devfolio-backend
    restart: always
    container_name: devfolio-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-router.rule=(Host(`makridakis.tech`) || Host(`www.makridakis.tech`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-router.entrypoints=websecure"
      - "traefik.http.routers.backend-router.tls.certresolver=devfolio-resolver"
      - "traefik.http.services.backend-service.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v3.3.6
    container_name: traefik
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/letsencrypt
    command:
      - "--api.dashboard=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--providers.docker=true"
      - "--certificatesresolvers.devfolio-resolver.acme.email=c.makridakis@gmx.de"
      - "--certificatesresolvers.devfolio-resolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.devfolio-resolver.acme.httpchallenge=true"
      - "--certificatesresolvers.devfolio-resolver.acme.httpchallenge.entrypoint=web"